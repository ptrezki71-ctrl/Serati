<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Serati – Kenali, pelajari, dan pesan upakara Bali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#3A2BD8; --indigo-d:#2A1FA8; --magenta:#E2357F; --orange:#F7931E; --leaf:#1F8A5B;
  --ink:#16123A; --muted:#5F5A7E; --faint:#8E8AA8; --bg:#F6F5FA; --surface:#FFFFFF; --line:#E5E2F0; --soft:#F0EEF8;
  --okbg:#E3F5EC; --ok:#17784F; --warnbg:#FFF2E2; --warn:#9A5200; --wa:#1E9E58;
  --display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(22,18,58,.04),0 8px 24px -12px rgba(22,18,58,.12);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F1EFFF; --muted:#ABA6CC; --faint:#7F7AA3; --bg:#100D26; --surface:#1A163A; --line:#2E2860; --soft:#231E4A;
    --okbg:#173A2C; --ok:#62D6A3; --warnbg:#3D2A12; --warn:#FFB45C; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#F1EFFF; --muted:#ABA6CC; --faint:#7F7AA3; --bg:#100D26; --surface:#1A163A; --line:#2E2860; --soft:#231E4A;
  --okbg:#173A2C; --ok:#62D6A3; --warnbg:#3D2A12; --warn:#FFB45C; --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
img,video{max-width:100%;display:block}
h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;margin:0}
h2{font-size:26px;font-weight:800;line-height:1.15}
h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--indigo);display:grid;place-items:center}
.brand b{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:10.5px;color:var(--faint);font-weight:600;margin-top:-3px}
.tnav{display:none;gap:4px;margin-left:12px}
.tnav button{border:0;background:none;padding:8px 12px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.tnav button[aria-current="page"]{color:var(--indigo);background:var(--soft)}
.tnav .lensbtn{background:var(--indigo);color:#fff}
.tnav .lensbtn[aria-current="page"]{background:var(--indigo-d);color:#fff}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 11px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.iconbtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn .count{position:absolute;top:-5px;right:-5px;background:var(--magenta);color:#fff;font-size:10.5px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.motifbar{height:4px;background:linear-gradient(90deg,var(--indigo) 0 25%,var(--magenta) 25% 50%,var(--orange) 50% 75%,#2F8CF0 75%)}
@media (min-width:920px){.tnav{display:flex}.locchip-m{display:none}}
@media (max-width:919px){.locchip-d{display:none}.brand small{display:none}}

main{padding:24px 0 120px}
@media (min-width:920px){main{padding-bottom:64px}}

/* Bottom nav (mobile) */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom div{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto}
nav.bottom button{border:0;background:none;padding:8px 2px 10px;font-size:11px;font-weight:600;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-current="page"]{color:var(--indigo)}
nav.bottom .lens{position:relative}
nav.bottom .lens span.ring{width:50px;height:50px;margin-top:-22px;border-radius:16px;background:var(--indigo);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px -8px rgba(58,43,216,.7);border:4px solid var(--surface)}
nav.bottom .lens span.ring svg{width:24px;height:24px}
@media (min-width:920px){nav.bottom{display:none}}

/* Common */
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--indigo);color:#fff;font-weight:700;padding:12px 18px;border-radius:12px;font-size:15px;text-decoration:none}
.btn:hover{background:var(--indigo-d)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:8px 13px;font-size:13.5px;border-radius:10px}
.btn.wide{width:100%}
.btn.wa{background:var(--wa)}
.btn.pink{background:var(--magenta)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--indigo);font-weight:700;font-size:14px}
.link.danger{color:var(--magenta)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.soft{background:var(--soft);color:var(--indigo)}
.note{font-size:12.5px;color:var(--muted)}
.sect{margin-top:36px}
.sect-h{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}
label.f{display:block;font-weight:600;font-size:13.5px;margin:12px 0 6px}
select,input[type=text],input[type=search],textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
textarea{resize:vertical;min-height:80px}
.empty{text-align:center;padding:28px 18px;border:1.5px dashed var(--line);border-radius:var(--r-lg);color:var(--muted);background:var(--surface)}
.grid{display:grid;gap:16px}

/* Hero */
.hero{display:grid;gap:28px;align-items:center;grid-template-columns:1fr}
@media (min-width:920px){.hero{grid-template-columns:1.1fr .9fr}}
.hero h1{font-size:clamp(32px,5vw,50px);font-weight:800;line-height:1.04;letter-spacing:-.03em}
.hero p.lead{font-size:17px;color:var(--muted);margin-top:14px;max-width:46ch}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.vf{position:relative;aspect-ratio:4/3.4;border-radius:28px;background:#14103A;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:22px}
.vf .grid9{position:absolute;inset:0;display:grid;grid-template-columns:repeat(2,1fr);gap:2px;opacity:.9}
.vf .grid9 div{display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.01em}
.vf .corner{position:absolute;width:44px;height:44px;border:4px solid #fff;opacity:.95}
.vf .c1{top:44px;left:44px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.vf .c2{top:44px;right:44px;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.vf .c3{bottom:110px;left:44px;border-right:0;border-top:0;border-radius:0 0 0 12px}
.vf .c4{bottom:110px;right:44px;border-left:0;border-top:0;border-radius:0 0 12px 0}
.vf .scan{position:absolute;left:44px;right:44px;top:44px;height:3px;background:linear-gradient(90deg,transparent,#fff,transparent);animation:scan 3.2s ease-in-out infinite}
@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(170px)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){.vf .scan{animation:none;display:none}}
.vf .res{position:relative;background:rgba(255,255,255,.96);color:#16123A;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.vf .res b{font-family:var(--display);font-size:17px}
.vf .res .bar{height:6px;border-radius:3px;background:#ECEAFD;margin-top:6px;overflow:hidden}
.vf .res .bar i{display:block;height:100%;width:92%;background:var(--leaf)}

/* Category tiles */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:920px){.cats{grid-template-columns:repeat(4,1fr)}}
.cat{text-align:left;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.cat .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.cat .ico svg{width:24px;height:24px}
.cat p{font-size:13px;color:var(--muted)}
.cat .n{font-size:12.5px;font-weight:700}

.how{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:760px){.how{grid-template-columns:repeat(3,1fr)}}
.how .card{display:flex;gap:14px}
.how .num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--indigo);display:grid;place-items:center;font-weight:800;font-family:var(--display)}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}
.stat.big{background:var(--leaf);border-color:var(--leaf);color:#fff}
.stat.big span{color:#fff;opacity:.85}

/* Catalog */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13.5px}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.filters button span{color:var(--faint);font-weight:500;margin-left:4px}
.filters button[aria-pressed="true"] span{color:var(--bg);opacity:.7}
.search{position:relative;max-width:420px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint)}
.search input{padding-left:38px}
.items{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.item{display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;padding:0;box-shadow:var(--shadow);transition:transform .15s ease, box-shadow .15s ease}
.item:hover{transform:translateY(-2px);box-shadow:0 12px 28px -14px rgba(22,18,58,.3)}
@media (prefers-reduced-motion: reduce){.item{transition:none}.item:hover{transform:none}}
.item .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.item h3{font-size:16.5px}
.item p{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px;font-size:13px;font-weight:700}

/* Media */
.media{position:relative;aspect-ratio:4/3;background:var(--soft);overflow:hidden}
.media img,.media video{width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:12px}
.ph::before{content:"";position:absolute;inset:0;opacity:.55;background-image:repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,255,255,.55) 14px 16px)}
.ph svg{position:relative;width:46px;height:46px;opacity:.9}
.ph span{position:relative;font-size:11.5px;font-weight:700;opacity:.85}
.media .catb{position:absolute;top:10px;left:10px}
.media .cnt{position:absolute;bottom:10px;right:10px;background:rgba(22,18,58,.75);color:#fff;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px}

/* Detail */
.crumb{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.crumb button{border:0;background:none;padding:0;color:var(--indigo);font-weight:600}
.detail{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
.detail>*,.two>*,.lens-wrap>*,.hero>*{min-width:0}
@media (min-width:920px){.detail{grid-template-columns:420px minmax(0,1fr)}.detail .left{position:sticky;top:88px;align-self:start}}
.gal .main{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line)}
.gal .thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.gal .thumbs button{flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--soft)}
.gal .thumbs button[aria-pressed="true"]{border-color:var(--indigo)}
.gal .thumbs img{width:100%;height:100%;object-fit:cover}
.upl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.upl label{cursor:pointer}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.dh h1{font-size:clamp(28px,4vw,40px);font-weight:800;line-height:1.08;letter-spacing:-.025em;margin:8px 0 4px}
.dh .alias{color:var(--faint);font-weight:600;font-size:14px}
.dh .lead{font-size:16.5px;margin-top:10px}
.when{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:var(--r-md);padding:12px 14px;margin-top:14px;font-size:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 18px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;font-size:14.5px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--indigo);border-bottom-color:var(--indigo)}
.tabs button span{font-weight:600;color:var(--faint);margin-left:4px}
.makna{display:flex;flex-direction:column;gap:12px}
.makna p{font-size:16px;line-height:1.7;max-width:66ch}
.makna p:first-child::first-letter{font-family:var(--display);font-size:46px;font-weight:800;float:left;line-height:.9;margin:6px 8px 0 0;color:var(--indigo)}
.refs{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.refs ul{margin:8px 0 0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.verify{display:flex;gap:10px;align-items:flex-start;background:var(--warnbg);color:var(--warn);border-radius:var(--r-md);padding:12px 14px;font-size:13.5px;margin-top:14px}
.steps{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.stepc{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:14px;width:100%}
.stepc .no{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--muted)}
.stepc b{display:block;font-size:15px}
.stepc span{font-size:14px;color:var(--muted)}
.stepc[aria-pressed="true"]{background:var(--okbg);border-color:transparent}
.stepc[aria-pressed="true"] .no{background:var(--ok);border-color:var(--ok);color:#fff}
.stepc[aria-pressed="true"] b{text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.75}
.prog{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--leaf);transition:width .3s}
.videobox{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:#000}
.videobox video{width:100%;max-height:420px}
.novideo{display:flex;gap:14px;align-items:center;border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:16px;background:var(--surface)}
.novideo .play{flex:none;width:52px;height:52px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--indigo)}
.blist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.blist li label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;font-size:14.5px}
.blist input{margin-top:3px;width:17px;height:17px;accent-color:var(--leaf)}
.orderbox{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);align-items:start}
.orderbox>*{min-width:0}
@media (min-width:760px){.orderbox{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mat>div{min-width:0}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:700}
.qty output{min-width:40px;text-align:center;font-weight:800;font-size:18px;font-family:var(--display)}
.score{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:center}
.ring{position:relative;width:88px;height:88px}
.ring svg{width:88px;height:88px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:19px;font-weight:800}
.ring circle{transition:stroke-dashoffset .5s ease}
.switch{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-weight:600;font-size:14px;text-align:left;margin-top:8px}
.switch i{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"] i{background:var(--leaf)}
.switch[aria-checked="true"] i::after{transform:translateX(18px)}
.mat{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.mat:first-child{border-top:0}
.mat .o{font-size:12px;color:var(--muted)}
.mat .r{text-align:right;font-weight:600;white-space:nowrap}
.swap{font-size:12px;color:var(--ok)}
.related{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.related button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13.5px}

/* Lens */
.lens-wrap{display:grid;gap:24px;grid-template-columns:1fr}
@media (min-width:920px){.lens-wrap{grid-template-columns:1fr 1fr}}
.shot{position:relative;aspect-ratio:4/3;border-radius:24px;overflow:hidden;background:#14103A;color:#fff;display:flex;align-items:center;justify-content:center}
.shot img{width:100%;height:100%;object-fit:cover}
.shot .corner{position:absolute;width:40px;height:40px;border:4px solid #fff;opacity:.9}
.shot .c1{top:24px;left:24px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.shot .c2{top:24px;right:24px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.shot .c3{bottom:24px;left:24px;border-right:0;border-top:0;border-radius:0 0 0 10px}
.shot .c4{bottom:24px;right:24px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.shot .hint{text-align:center;padding:24px;max-width:30ch}
.shot .hint svg{width:48px;height:48px;margin:0 auto 10px;display:block;opacity:.9}
.shot .busy{position:absolute;inset:0;background:rgba(20,16,58,.55);display:grid;place-items:center;font-weight:700}
.shot .busy .scan{position:absolute;left:24px;right:24px;top:24px;height:3px;background:linear-gradient(90deg,transparent,#fff,transparent);animation:scan2 1.6s ease-in-out infinite}
@keyframes scan2{0%{top:24px}50%{top:calc(100% - 28px)}100%{top:24px}}
@media (prefers-reduced-motion: reduce){.shot .busy .scan{animation:none}}
.shotbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.shotbtns label{cursor:pointer}
.shotbtns input{position:absolute;width:1px;height:1px;opacity:0}
.result{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.result .top-r{padding:18px;display:flex;flex-direction:column;gap:8px}
.conf{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.conf .bar{flex:1;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.conf .bar i{display:block;height:100%;background:var(--leaf)}
.alts{display:flex;gap:8px;flex-wrap:wrap}
.choice{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.choice button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:4px}
.choice button b{font-size:15px}
.choice button span{font-size:13px;color:var(--muted)}

/* Serati */
.tmap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(3,72px);gap:6px}
.tmap button{min-width:0;overflow:hidden;overflow-wrap:anywhere}
@media (max-width:520px){.tmap{grid-template-rows:repeat(3,62px);gap:4px}.tmap button{font-size:10.5px;padding:6px;border-radius:10px}.tmap button span{font-size:10px}}
.tmap button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px;text-align:left;font-size:12.5px;font-weight:700;line-height:1.2;display:flex;flex-direction:column;justify-content:space-between}
.tmap button span{font-weight:500;color:var(--muted);font-size:11.5px}
.tmap button[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}
.tmap button[aria-pressed="true"] span{color:#DAD6FF}
.srt{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start}
.av{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips span{font-size:12px;background:var(--soft);padding:3px 9px;border-radius:999px;font-weight:600}
.two{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:920px){.two{grid-template-columns:380px minmax(0,1fr)}}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--leaf)}

/* Forum */
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px}
.post .who{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.post .who b{font-size:14px}
.post .who span{color:var(--faint);font-size:12.5px}
.post p{margin-top:6px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.reply{margin:12px 0 0 12px;padding-left:12px;border-left:2px solid var(--line)}
.post .pa{display:flex;gap:14px;margin-top:8px}

/* Cart bar */
.addbar{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.addbar[hidden]{display:none}
.addbar>div{pointer-events:auto;width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px 10px 16px;box-shadow:0 14px 30px -14px rgba(22,18,58,.6)}
.addbar strong{font-size:16px}
.addbar span{display:block;font-size:12px;opacity:.75}
@media (min-width:920px){.addbar{bottom:20px}}

dialog{border:0;border-radius:22px;padding:22px;max-width:440px;width:calc(100% - 32px);background:var(--surface);color:var(--ink);box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(16,13,38,.55)}
dialog.big{max-width:620px}
.stepview .num{font-family:var(--display);font-size:54px;font-weight:800;color:var(--indigo);line-height:1}
.stepview h3{font-size:24px;margin:6px 0 8px}
.stepview p{font-size:17px;line-height:1.6}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;transition:all .25s;z-index:40;max-width:90vw;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

{id:"canang-sari",cat:"canang",nama:"Canang Sari",ringkas:"Canang dua bagian: ceper berisi raka-raka di bawah dan sampian uras sari berisi bunga di atas.",kapan:"Persembahan harian; juga pada Kliwon, Purnama, Tilem, saat sembahyang di pura, dan sebagai pelengkap banten lain.",

const CFG=Object.assign({SUPABASE_URL:"",SUPABASE_ANON_KEY:"",LENS_ENDPOINT:"",MEDIA_BUCKET:"media",SUPABASE_JS:"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"},window.SERATI_CONFIG||{});
function lsGet(k,d){try{const v=JSON.parse(localStorage.getItem(k)||"null");return v==null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const LIVE={sb:null,posts:[],media:{},forum:"local",lens:!!CFG.LENS_ENDPOINT,ready:true,me:lsGet("serati-me",null)};
if(!LIVE.me){LIVE.me="u"+Math.random().toString(36).slice(2,10);lsSet("serati-me",LIVE.me);}
const IMG_RE=/\.(jpe?g|png|webp)$/i, VID_RE=/\.(mp4|webm)$/i;
function loadScript(src,ms){return new Promise(res=>{const s=document.createElement("script");let done=false;const fin=ok=>{if(!done){done=true;res(ok);}};s.src=src;s.async=true;s.onload=()=>fin(true);s.onerror=()=>fin(false);setTimeout(()=>fin(false),ms);document.head.appendChild(s);});}
async function sbInit(){
  LIVE.posts=lsGet("serati-forum-lokal",[]);
  if(!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY)){render();return;}
  LIVE.forum="loading";render();
  if(!(window.supabase&&window.supabase.createClient)){const ok=await loadScript(CFG.SUPABASE_JS,12000);if(!ok||!window.supabase||!window.supabase.createClient){LIVE.forum="off";render();return;}}
  try{LIVE.sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}});}catch(e){LIVE.forum="off";render();return;}
  await loadPosts(true);
  setInterval(()=>{if(!document.hidden)loadPosts(false);},20000);
  loadMedia();
}
async function loadPosts(first){
  try{
    const {data,error}=await LIVE.sb.from("posts").select("id,topic,parent,text,kab,name,author,created_at").order("created_at",{ascending:true}).limit(800);
    if(error)throw error;
    LIVE.posts=(data||[]).map(p=>({...p,at:Date.parse(p.created_at)||Date.now()}));LIVE.forum="ok";
  }catch(e){if(first||LIVE.forum!=="ok"){LIVE.forum="slow";LIVE.posts=lsGet("serati-forum-lokal",[]);}}
  render();
}
async function loadMedia(){
  const st=LIVE.sb.storage.from(CFG.MEDIA_BUCKET);const m={};
  await Promise.all(ITEMS.map(async it=>{
    try{
      const {data,error}=await st.list(it.id,{limit:50,sortBy:{column:"name",order:"asc"}});
      if(error||!Array.isArray(data))return;
      const url=n=>st.getPublicUrl(it.id+"/"+n).data.publicUrl;
      const photos=data.filter(f=>f&&IMG_RE.test(f.name)).map(f=>url(f.name));
      const vid=data.find(f=>f&&VID_RE.test(f.name));
      if(photos.length||vid)m[it.id]={photos,video:vid?url(vid.name):null};
    }catch(e){}
  }));
  LIVE.media=m;render();
}
const photosOf=id=>((LIVE.media[id]||{}).photos||[]);
const videoOf=id=>(LIVE.media[id]||{}).video||null;
const canUpload=()=>false; /* foto & video diunggah tim lewat dasbor Supabase (lihat PANDUAN) */

async function compress(file){
  try{
    const bmp=await createImageBitmap(file);const max=1280;const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(res=>cv.toBlob(b=>res(b||file),"image/jpeg",.86));
  }catch(e){return file;}
}
function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=()=>rej(r.error);r.readAsDataURL(b);});}
async function identify(){
  const L=S.lens;if(!L.file||!LIVE.lens||L.busy)return;
  L.busy=true;L.err=null;L.res=null;L.fb=null;render();
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),35000);
  try{
    const image=await blobToB64(L.file);
    const r=await fetch(CFG.LENS_ENDPOINT,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({image,mediaType:L.file.type||"image/jpeg"}),signal:ctrl.signal});
    let res=null;try{res=await r.json();}catch(e){}
    if(!r.ok)throw {code:(res&&res.error)||("http_"+r.status)};
    if(!res||typeof res!=="object"||Array.isArray(res))throw {code:"invalid_json"};
    if(res.id&&!BYID[res.id])res.id=null;
    res.keyakinan=Math.max(0,Math.min(1,Number(res.keyakinan)||0));
    res.alasan=typeof res.alasan==="string"?res.alasan.slice(0,400):"";
    res.alternatif=Array.isArray(res.alternatif)?res.alternatif.filter(x=>x&&BYID[x.id]).map(x=>({id:x.id,keyakinan:Math.max(0,Math.min(1,Number(x.keyakinan)||0))})).slice(0,2):[];
    L.res=res;
  }catch(e){
    const code=e&&(e.code||e.name);
    const m={AbortError:"Lens terlalu lama merespons. Coba lagi.",rate_limited:"Terlalu banyak permintaan. Tunggu sebentar lalu coba lagi.",too_large:"Foto terlalu besar. Coba foto lain.",bad_request:"Format foto tidak didukung. Gunakan JPG, PNG, atau WebP.",lens_not_configured:"Lens AI belum diaktifkan di server. Gunakan Kenali manual.",http_404:"Lens AI belum aktif di alamat ini. Gunakan Kenali manual.",http_405:"Lens AI belum aktif di alamat ini. Gunakan Kenali manual.",invalid_json:"Jawaban Lens tidak terbaca. Coba lagi.",upstream_error:"Layanan AI sedang bermasalah. Coba lagi beberapa saat lagi."}[code];
    L.err=m||"Lens belum bisa mengenali foto ini. Periksa koneksi lalu coba lagi, atau gunakan Kenali manual.";
  }finally{clearTimeout(to);}
  L.busy=false;render();
}

const topicName=t=>t==="umum"?"Umum":(BYID[t]?BYID[t].nama:t);
const nameOf=p=>(p.name||"Warga")+(!p.ex&&p.author===LIVE.me?" (kamu)":"");
function threadsCount(topic){return LIVE.posts.filter(p=>p.topic===topic&&!p.parent).length+EXAMPLES.filter(p=>p.topic===topic&&!p.parent).length;}
function threadsHtml(topic){
  const live=LIVE.posts.filter(p=>p.topic===topic),ex=EXAMPLES.filter(p=>p.topic===topic);
  const all=[...ex,...live];const roots=all.filter(p=>!p.parent).sort((a,b)=>(b.at||0)-(a.at||0));
  const kids=id=>all.filter(p=>p.parent===id).sort((a,b)=>(a.at||0)-(b.at||0));
  const canPost=LIVE.forum!=="loading";
  const one=p=>`<div class="who"><b>${esc(nameOf(p))}</b>${p.ex?`<span class="badge soft">Contoh</span>`:""}<span>${[p.kab&&KAB[p.kab]?esc(KAB[p.kab].n):"",p.ex?"":ago(p.at)].filter(Boolean).join(" · ")}</span></div><p>${esc(p.text)}</p>`;
  const acts=p=>`<div class="pa">${!p.parent&&canPost?`<button type="button" class="link" data-reply="${esc(p.id)}">Balas</button>`:""}${!p.ex&&LIVE.forum!=="ok"&&p.author===LIVE.me?`<button type="button" class="link danger" data-delpost="${esc(p.id)}">Hapus</button>`:""}</div>`;
  const status={loading:"Memuat diskusi…",slow:"Server diskusi belum bisa dihubungi. Halaman mencoba lagi setiap 20 detik; sementara itu pesan baru disimpan di perangkat ini.",off:"Server diskusi tidak dapat dihubungi. Pesan disimpan di perangkat ini.",local:"Mode lokal: pesan tersimpan di perangkat ini saja. Hubungkan Supabase agar diskusi bisa dibaca semua orang.",ok:""}[LIVE.forum];
  return `${status?`<p class="note" style="margin-bottom:10px">${status}</p>`:""}
  ${canPost?`<div class="card" style="margin-bottom:14px"><label class="f" for="np" style="margin-top:0">${S.replyTo?"Balas diskusi":"Tanya atau berbagi tentang "+esc(topicName(topic).toLowerCase())}</label>
    <input type="text" id="nm" data-keep="nm" maxlength="40" placeholder="Nama tampilan (misalnya Made dari Gianyar)" value="${esc(lsGet("serati-nama",""))}" style="margin-bottom:8px">

    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap"><span class="note">Ditandai dari ${esc(kabName(S.kab))}. Jangan tulis nomor telepon atau alamat lengkap.</span><span style="display:flex;gap:8px">${S.replyTo?`<button type="button" class="btn ghost sm" data-cancelreply>Batal</button>`:""}<button type="button" class="btn sm" data-post="${esc(topic)}">Kirim</button></span></div></div>`:""}
  ${roots.length?roots.map(p=>`<article class="post">${one(p)}${acts(p)}${kids(p.id).map(k=>`<div class="reply">${one(k)}${acts(k)}</div>`).join("")}</article>`).join(""):`<div class="empty">Belum ada diskusi tentang ${esc(topicName(topic).toLowerCase())}. Jadilah yang pertama bertanya.</div>`}`;
}

document.addEventListener("input",e=>{const t=e.target;if(t.id==="q"){S.q=t.value;clearTimeout(window.__qt);window.__qt=setTimeout(render,120);}});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="kec"){S.kec=t.value;save();render();return;}
  if(t.dataset.pick){S.pick[t.dataset.pick]=t.value;render();return;}
  if(t.dataset.topicsel!==undefined){S.topic=t.value;S.replyTo=null;render();return;}
  if(t.dataset.have!==undefined){const a=S.have[S.item]||[];a[+t.dataset.have]=t.checked;S.have[S.item]=a;save();return;}
  if(t.dataset.lensfile!==undefined&&t.files&&t.files[0]){
    const f=t.files[0];if(S.lens.url)URL.revokeObjectURL(S.lens.url);
    const blob=await compress(f);S.lens={...S.lens,file:blob,url:URL.createObjectURL(blob),res:null,err:null,fb:null};t.value="";render();
    if(LIVE.lens)identify();
    return;
  }
  const ph=t.dataset.upphoto,vd=t.dataset.upvideo;
  if((ph||vd)&&t.files&&t.files[0]){const f=ph?await compress(t.files[0]):t.files[0];await uploadMedia(ph||vd,f,!!ph);t.value="";}
});
async function uploadMedia(){toast("Foto dan video diunggah tim lewat dasbor Supabase");}
document.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;const ds=t.dataset;

  if(ds.itemtab){const [id,tab]=ds.itemtab.split("|");S.dtab=tab;go("detail",id,{keepTab:true});return;}
  if(ds.cat){S.cat=ds.cat;S.q="";if(S.view!=="katalog")go("katalog");else render();return;}
  if(ds.dtab){S.dtab=ds.dtab;S.replyTo=null;render();return;}
  if(ds.ph!==undefined){S.photoIdx=+ds.ph;render();return;}
  if(ds.step!==undefined){const a=S.done[S.item]||[];a[+ds.step]=!a[+ds.step];S.done[S.item]=a;save();render();return;}
  if(ds.resetsteps){S.done[ds.resetsteps]=[];save();render();return;}
  if(ds.stepmode!==undefined){if(ds.markdone!==undefined){const a=S.done[S.item]||[];a[+ds.markdone]=true;S.done[S.item]=a;save();render();}stepDialog(+ds.stepmode);return;}
  if("close" in ds){if(ds.markdone!==undefined){const a=S.done[S.item]||[];a[+ds.markdone]=true;S.done[S.item]=a;save();render();}if(ds.close==="wa")toast("Simulasi: membuka chat WhatsApp serati");document.getElementById("dlg").close();return;}
  if(ds.cq){const it=BYID[S.item];const cs=S.calc[it.id]||{n:CALC[it.calc].def,lokal:false};cs.n=Math.max(1,cs.n+ +ds.cq);S.calc[it.id]=cs;render();return;}
  if("lokal" in ds){const it=BYID[S.item];const cs=S.calc[it.id]||{n:CALC[it.calc].def,lokal:false};cs.lokal=!cs.lokal;S.calc[it.id]=cs;render();if(cs.lokal)toast("Bahan luar Bali diganti produk lokal");return;}
  if(ds.jq){const it=BYID[S.item];S.jadi[it.id]=Math.max(1,(S.jadi[it.id]??(it.unit==="set"?1:10))+ +ds.jq);render();return;}
  if(ds.addjadi){const it=BYID[ds.addjadi];const n=S.jadi[it.id]??(it.unit==="set"?1:10);const list=seratiFor(S.kab,it.cat);const sid=S.pick[it.id]&&list.some(s=>s.id===S.pick[it.id])?S.pick[it.id]:list[0].id;const s=SERATI.find(x=>x.id===sid);
    S.cart.push({label:`${it.nama} ×${n}`,by:`Banten jadi · ${s.nama}, Kec. ${s.kec}`,total:it.harga*n,lokal:1,cat:it.cat,swapped:0});save();render();toast("Masuk ke keranjang");return;}
  if(ds.addcalc){const it=BYID[ds.addcalc];const cs=S.calc[it.id]||{n:CALC[it.calc].def,lokal:false};const mats=calcMats(it,cs.n,cs.lokal);
    S.cart.push({label:`Bahan ${it.nama} ×${cs.n}`,by:"Bahan dari produsen lokal",total:matVal(mats),lokal:matLocal(mats),cat:it.cat,swapped:mats.filter(m=>m.swapped).reduce((a,m)=>a+m.q,0)});save();render();toast("Bahan masuk ke keranjang");return;}
  if(ds.del!==undefined){S.cart.splice(+ds.del,1);save();render();return;}
  if("checkout" in ds){const tot=S.cart.reduce((s,c)=>s+c.total,0);const loc=tot?S.cart.reduce((s,c)=>s+c.total*c.lokal,0)/tot:1;

  if("reset" in ds){S.cart=[];S.orders=[];save();render();toast("Data demo dihapus");return;}

  if(ds.contact){contactDialog(ds.contact);return;}
  if(ds.orderfrom){const s=SERATI.find(x=>x.id===ds.orderfrom);S.kab=s.kab;S.kec=s.kec;save();S.cat=s.lay[0];go("katalog");toast(`Pilih upakara, lalu pesan ke ${s.nama}`);return;}
  if("daftar" in ds){daftarDialog();return;}
  if("senddaftar" in ds){const nama=document.getElementById("dn").value.trim();if(!nama){toast("Isi nama usaha dulu");return;}
    const rec={nama:nama.slice(0,60),kab:S.kab,kec:document.getElementById("dk").value,layanan:[...document.querySelectorAll(".dl:checked")].map(x=>x.value)};document.getElementById("dlg").close();
    if(LIVE.sb){try{const {error}=await LIVE.sb.from("pendaftaran_serati").insert(rec);if(error)throw error;toast("Pendaftaran terkirim, tim akan memverifikasi");}catch(err){toast("Pendaftaran belum bisa dikirim, coba lagi");}}else toast("Mode lokal: pendaftaran belum terkirim ke server");return;}
  if("identify" in ds){identify();return;}
  if(ds.manual!==undefined){S.lens.manual=ds.manual||null;render();return;}
  if(ds.fb){const r=S.lens.res;let actual=r&&r.id;if(ds.fb==="fix"){actual=document.getElementById("fbsel").value;if(!actual){toast("Pilih jenis yang benar dulu");return;}}
    S.lens.fb="sent";render();
    if(LIVE.sb){try{await LIVE.sb.from("lens_feedback").insert({pred:(r&&r.id)||null,actual,conf:(r&&r.keyakinan)||0});}catch(err){}}
    if(ds.fb==="fix"&&BYID[actual])toast("Tercatat sebagai "+BYID[actual].nama);return;}
  if(ds.savephoto){if(S.lens.file){await uploadMedia(ds.savephoto,S.lens.file,true);}return;}
  if(ds.topicgo){S.topic=ds.topicgo;go("diskusi");return;}
  if(ds.reply){S.replyTo=ds.reply;render();const el=document.getElementById("np");if(el){el.focus();el.scrollIntoView({block:"center"});}return;}
  if("cancelreply" in ds){S.replyTo=null;render();return;}
  if(ds.post){const el=document.getElementById("np");const text=el.value.trim();const nmEl=document.getElementById("nm");const name=((nmEl&&nmEl.value.trim())||"Warga").slice(0,40);
    if(!text){toast("Tulis sesuatu dulu");return;}
    if(/(\+?62|08)\d[\d\s-]{7,}/.test(text)){toast("Hapus nomor telepon dari pesanmu");return;}
    lsSet("serati-nama",name);
    const rec={topic:ds.post,parent:S.replyTo||null,text:text.slice(0,600),kab:S.kab,name,author:LIVE.me};
    t.disabled=true;
    if(LIVE.sb&&LIVE.forum==="ok"){
      try{const {error}=await LIVE.sb.from("posts").insert(rec);if(error)throw error;el.value="";S.replyTo=null;await loadPosts(false);toast("Terkirim");}
      catch(err){toast("Belum terkirim, coba lagi");t.disabled=false;}
    }else{
      const local=lsGet("serati-forum-lokal",[]);local.push({...rec,id:"l"+Date.now().toString(36),at:Date.now()});lsSet("serati-forum-lokal",local);
      if(LIVE.forum!=="ok")LIVE.posts=local;el.value="";S.replyTo=null;render();toast("Tersimpan di perangkat ini");
    }
    return;}
  if(ds.delpost){if(!confirm("Hapus pesan ini?"))return;const local=lsGet("serati-forum-lokal",[]).filter(p=>p.id!==ds.delpost);lsSet("serati-forum-lokal",local);if(LIVE.forum!=="ok")LIVE.posts=local;render();toast("Pesan dihapus");return;}
});
fromHash();render();sbInit();
</script>
</body></html>
